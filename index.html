<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141414">
<meta name="description" content="Control diario SISO del proyecto: inspecciones, charlas, EPP, botiquín, sucesos y entregas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SISO">
<title>SISO Yorito–Empalme</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: practical field tool for a site safety officer — terse, sure, no decoration
   IDEA: the obra's safety board: hazard-striped header, road-sign lettering, tick boxes
   PICTURE: today's board itself — big date, due list and day counters fill the first screen
   COLOUR and TYPE: safety orange + asphalt black + sign white; Barlow Condensed signage + Barlow body
   LAYOUT: one column of tickets; bottom bar on phone, top bar on wide screens */
:root{color-scheme:light dark;--bg:light-dark(#f4f2ee,#121212);--card:light-dark(#fff,#1d1d1d);--ink:light-dark(#151515,#f1efe9);--mut:light-dark(#5d5a55,#a7a39b);--line:light-dark(#dedad2,#333);--or:#ff5a00;--orx:light-dark(#d94a00,#ff7a2e);--yl:#ffc61a;--ok:light-dark(#0b7a5a,#3cc39a);--bad:light-dark(#c8231b,#ff5a4f);--soft:light-dark(#fff1e8,#2a1d14)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;padding-bottom:84px}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Barlow,sans-serif;line-height:1.05;margin:0}
h2{font-size:28px;font-weight:800}h3{font-size:20px;font-weight:700}
header{background:#141414;color:#fff;padding-top:env(safe-area-inset-top)}
.hz{height:10px;background:repeating-linear-gradient(-45deg,var(--yl) 0 14px,#141414 14px 28px)}
.top{display:flex;align-items:center;gap:12px;padding:12px max(4vw,14px);max-width:1100px;margin:auto}
.top h1{font-size:24px;font-weight:800;letter-spacing:.01em;flex:1}
.top h1 small{display:block;font:500 13px Barlow,system-ui,sans-serif;color:#bdb8ae;letter-spacing:0}
.top button{background:none;border:1px solid #555;color:#fff;border-radius:8px;min-height:40px;padding:0 12px;font:600 14px Barlow,system-ui,sans-serif}
nav{position:fixed;bottom:0;left:0;right:0;background:#141414;display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;color:#cfcac0;text-decoration:none;text-align:center;padding:9px 2px 8px;font:700 13px "Barlow Condensed",Barlow,sans-serif;letter-spacing:.02em;border-top:3px solid transparent}
nav a svg{display:block;margin:0 auto 2px;width:22px;height:22px}
nav a.on{color:#fff;border-top-color:var(--or)}
nav a.add{color:#141414;background:var(--or)}
@media(min-width:820px){body{padding-bottom:0}nav{position:sticky;top:0;bottom:auto;justify-content:center}nav a{flex:0 0 130px;border-top:0;border-bottom:3px solid transparent}nav a.on{border-bottom-color:var(--or)}}
main{max-width:1100px;margin:auto;padding:18px max(4vw,14px) 30px}
.note{background:var(--soft);border-left:4px solid var(--or);padding:10px 12px;border-radius:6px;margin:0 0 14px;font-size:15px}
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-bottom:18px}
@media(min-width:820px){.hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.date{background:var(--or);color:#141414;border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;min-height:150px}
.date b{font:800 clamp(44px,9vw,64px)/.95 "Barlow Condensed"}
.date span{font:700 20px "Barlow Condensed",Barlow,sans-serif}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.stat b{display:block;font:800 34px/1 "Barlow Condensed",Barlow,sans-serif}.stat small{color:var(--mut);font-size:14px}
.stat.warn b{color:var(--bad)}.stat.good b{color:var(--ok)}
section{margin:22px 0}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .tx{flex:1}.row .tx b{display:block;font-weight:600}.row .tx small{color:var(--mut);font-size:14px}
.row.click{cursor:pointer}.row.click:hover{background:var(--soft)}
.day{flex:none;width:52px;text-align:center;font:800 26px/1 "Barlow Condensed",Barlow,sans-serif}.day small{display:block;font:600 12px Barlow,system-ui,sans-serif;color:var(--mut)}
.tag{display:inline-block;font:700 12px Barlow,system-ui,sans-serif;padding:2px 8px;border-radius:20px;white-space:nowrap;background:var(--line);color:var(--ink)}
.tag.bad{background:var(--bad);color:#fff}.tag.ok{background:var(--ok);color:#fff}.tag.or{background:var(--or);color:#141414}.tag.yl{background:var(--yl);color:#141414}
.btn{min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px Barlow,system-ui,sans-serif;padding:0 14px;cursor:pointer}
.btn.pri{background:var(--or);border-color:var(--or);color:#141414}
.btn.sm{min-height:36px;font-size:14px;padding:0 10px}
.btn.dk{background:#141414;color:#fff;border-color:#141414}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--yl);outline-offset:2px}
.chk{width:44px;height:44px;flex:none;border-radius:8px;border:2px solid var(--line);background:var(--card);cursor:pointer;font:800 22px Barlow,system-ui,sans-serif;color:var(--ok)}
.chk.done{background:var(--ok);border-color:var(--ok);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font:600 14px Barlow,system-ui,sans-serif;cursor:pointer;min-height:36px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;min-height:84px}
.tile b{display:block;font:700 19px/1.1 "Barlow Condensed",Barlow,sans-serif}.tile small{color:var(--mut)}
.tile:hover{border-color:var(--or)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select{flex:1 1 160px}
input,select,textarea{width:100%;min-height:44px;font:16px Barlow,system-ui,sans-serif;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:8px 10px}
textarea{min-height:88px;resize:vertical}
label.f{display:block;margin-bottom:12px}label.f>span{display:block;font:600 14px Barlow,system-ui,sans-serif;color:var(--mut);margin-bottom:4px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.fg .w{grid-column:1/-1}
@media(max-width:520px){.fg{grid-template-columns:minmax(0,1fr)}}
.ci{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.ci span{flex:1;font-size:15px}
.seg{display:flex;flex:none}.seg button{min-width:44px;min-height:38px;border:1px solid var(--line);background:var(--card);color:var(--mut);font:700 13px Barlow,system-ui,sans-serif;cursor:pointer}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.C{background:var(--ok);color:#fff;border-color:var(--ok)}.seg button.N{background:var(--bad);color:#fff;border-color:var(--bad)}.seg button.A{background:#777;color:#fff;border-color:#777}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px 10px 40px}
.modal.on{display:flex}
.sheet{background:var(--bg);border-radius:12px;width:min(720px,100%);overflow:hidden}
.sheet .hd{background:#141414;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.sheet .hd h3{flex:1;font-size:22px}
.sheet .bd{padding:16px}
.sheet .ft{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--bg)}
.ft .sp{flex:1}
.empty{padding:24px;text-align:center;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#141414;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-weight:600;display:none;max-width:90vw}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font:700 14px Barlow,system-ui,sans-serif;color:var(--mut)}td.n,th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.kv b{display:block;font:800 30px/1 "Barlow Condensed",Barlow,sans-serif}.kv small{color:var(--mut)}

.fotos{display:flex;flex-wrap:wrap;gap:8px}.ph{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--line)}.ph img{width:100%;height:100%;object-fit:cover;display:block}.ph button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font:700 15px Barlow,sans-serif;cursor:pointer}
.addph{width:96px;height:96px;border:2px dashed var(--or);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--orx);font:700 14px/1.2 Barlow,sans-serif;cursor:pointer;padding:6px}.addph input{position:absolute;width:1px;height:1px;opacity:0}
.sig canvas{width:100%;height:180px;background:#fff;border:2px dashed var(--or);border-radius:8px;touch-action:none;display:block}.sig img{width:100%;height:150px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;display:block}.sig .sr{display:flex;gap:8px;margin-top:6px;align-items:center;flex-wrap:wrap}.sig small{color:var(--mut)}
.li-row{display:grid;grid-template-columns:minmax(0,1fr) 56px 64px 40px;gap:6px;margin-bottom:6px}.li-row input{padding:8px 6px}.li-h{display:grid;grid-template-columns:minmax(0,1fr) 56px 64px 40px;gap:6px;font:600 13px Barlow,sans-serif;color:var(--mut)}
.sync{font:600 12px Barlow,system-ui,sans-serif;padding:3px 8px;border-radius:20px;white-space:nowrap}.sync.ok{background:#1f3b31;color:#7fe0bd}.sync.pend{background:var(--yl);color:#141414}.sync.off{background:#5a1f1b;color:#ffb3ad}.sync:empty{display:none}
.login{max-width:420px;margin:8vh auto;padding:22px}.hint{color:var(--mut);font-size:14px;margin:6px 0 0}
.li-row.nv,.li-h.nv{grid-template-columns:minmax(0,1fr) 64px 40px}
table.inv tr.click{cursor:pointer}table.inv tr.click:hover{background:var(--soft)}td.ex{font:800 20px "Barlow Condensed",Barlow,sans-serif;color:var(--ok)}td.ex.bad{color:var(--bad)}td.ex.warn{color:var(--orx)}
.tile.inv{border-left:5px solid var(--or)}
@media(max-width:480px){.top h1{font-size:20px}.top h1 small{font-size:12px}}
@media(prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(14px);opacity:.6}}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut)}.stack td:empty{display:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header><div class="hz"></div><div class="top"><h1 id="ptitle">SISO · Yorito – Empalme RN-23<small id="psub">Pavimentación DTS · 13.65 km</small></h1><span id="sync" class="sync" role="status"></span><button id="cfgBtn" type="button">Proyecto</button></div></header>
<nav id="nav">
<a href="#hoy" data-v="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>Hoy</a>
<a href="#agenda" data-v="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</a>
<a href="#nuevo" data-v="nuevo" class="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>Registrar</a>
<a href="#registros" data-v="registros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4zM4 9h16M4 14h16M9 4v16"/></svg>Registros</a>
<a href="#informe" data-v="informe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7M9 8h4"/></svg>Informe</a>
</nav>
<main id="main"><p class="empty">Cargando…</p></main>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
